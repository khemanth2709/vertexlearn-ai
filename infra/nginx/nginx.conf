events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream core_backend {
        server core-lms-service:5000;
    }

    upstream ai_backend {
        server ai-tutor-service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Healthcheck
        location /health {
            return 200 '{"status":"gateway_healthy"}';
            add_header Content-Type application/json;
        }

        # Core LMS API Endpoints
        location /api/v1/ {
            proxy_pass http://core_backend/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AI Tutor Microservice Endpoints
        location /api/v1/ai/ {
            proxy_pass http://ai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Client SPA Static routing fallback
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
